<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Diet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diet">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: lock screen first, then one column with a sticky day header and a bottom tab bar (Today / Calendar) */
:root {
  --bg: #1c1c1e;
  --surface: #2c2c2e;
  --raise: #3a3a3c;
  --line: #3a3a3c;
  --fg: #f2f2f7;
  --muted: #98989f;
  --key: #d1d1d6;
  --keyfg: #1c1c1e;
  --on: #e5e5ea;
  --lift: #34c759;
  --cardio: #1e5a32;
  --sun: #444446;
  --warn: #ff9f0a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
input, textarea { font-size: 16px; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4; }
body { padding: 0 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lift); outline-offset: 2px; }
[hidden] { display: none !important; }

/* lock screen */
#lock {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
}
#lock h1 { font-weight: 500; font-size: 20px; margin: 0; }
.dots { display: flex; gap: 18px; }
.dots i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--key); }
.dots i.f { background: var(--key); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px; }
.pad button {
  height: 76px; border-radius: 18px; border: 0; background: var(--key); color: var(--keyfg);
  font-size: 30px; font-weight: 400; cursor: pointer;
}
.pad button:active { background: #f2f2f7; }
.pad .del { background: transparent; color: var(--fg); font-size: 16px; }
.pad .blank { visibility: hidden; }

/* header */
.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  margin: 0 -16px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dnav { display: flex; align-items: center; gap: 4px; }
.dnav button { background: none; border: 0; font-size: 22px; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; color: var(--muted); }
.dtitle { font-size: 17px; font-weight: 600; min-width: 0; }
.dsub { font-size: 12px; color: var(--muted); }
.lockbtn { background: var(--surface); border: 0; border-radius: 10px; padding: 7px 11px; font-size: 13px; color: var(--muted); cursor: pointer; }
.kcal { font-size: 20px; font-weight: 600; }
.kcal small { font-size: 13px; color: var(--muted); font-weight: 400; }
.mini { font-size: 13px; color: var(--muted); }
.mini b { color: var(--fg); font-weight: 600; }
.track { height: 5px; background: var(--raise); border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--lift); width: 0; }

main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; padding-top: 12px; }
.card { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }

/* check-in */
.check { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.3fr); gap: 10px; }
.wbox { background: var(--raise); border-radius: 12px; padding: 8px 12px; display: grid; gap: 2px; }
.wbox label, .tlabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wline { display: flex; align-items: baseline; gap: 4px; }
.wbox input {
  width: 100%; min-width: 0; background: none; border: 0; color: var(--fg); font: inherit; font-size: 22px; font-weight: 600; padding: 0;
}
.wbox input::placeholder { color: #636366; font-weight: 400; }
.wbox span { color: var(--muted); font-size: 13px; }
.wdelta { font-size: 12px; color: var(--muted); }
.types { display: grid; gap: 6px; align-content: start; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tbtn { border: 0; border-radius: 12px; background: var(--raise); padding: 12px 8px; font-size: 14px; cursor: pointer; color: var(--muted); }
.tbtn.lift[aria-pressed="true"] { background: var(--lift); color: #0b2814; font-weight: 600; }
.tbtn.cardio[aria-pressed="true"] { background: var(--cardio); color: var(--fg); font-weight: 600; }

/* meals */
.mh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mh h2 { font-size: 19px; font-weight: 600; margin: 0; }
.when { color: var(--muted); font-size: 12px; }
.tip { color: var(--muted); font-size: 13px; margin: -6px 0 0; }
.group { display: grid; gap: 6px; }
.glabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.qwrap { display: inline-flex; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--raise);
  font-size: 14px; padding: 8px 11px; border-radius: 10px; cursor: pointer; text-align: left;
}
.chip small { color: var(--muted); font-size: 11.5px; }
.chip.on { background: var(--on); color: var(--keyfg); font-weight: 600; }
.chip.on small { color: #48484a; }
.qty { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: var(--keyfg); color: var(--on); font-size: 12px; font-weight: 600; padding: 0 5px; }
.minus { border: 0; background: var(--raise); font-size: 17px; width: 32px; border-radius: 10px; cursor: pointer; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--raise); background: transparent; font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.btn.primary { background: var(--on); color: var(--keyfg); border-color: var(--on); font-weight: 600; }
.sub { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.sub-mac { font-size: 14px; }
.sub-mac span { color: var(--muted); }
.link { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13px; }
.mgrid div { display: flex; justify-content: space-between; gap: 6px; min-width: 0; }
.mgrid span { color: var(--muted); }

/* totals */
.card h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
.rows { display: grid; gap: 9px; }
.r { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 10px; font-size: 14px; }
.r .v { text-align: right; }
.r .v span { color: var(--muted); }
.r .track { grid-column: 1 / -1; height: 4px; }
.r.over .track i { background: var(--warn); }
.note { color: var(--muted); font-size: 12px; margin: 0; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 5px; }
.cal .dow { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cell {
  aspect-ratio: 1 / 1.25; max-width: 100%; border: 0; border-radius: 10px; background: var(--raise);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
  padding: 5px; cursor: pointer; text-align: left; min-width: 0; overflow: hidden;
}
.cell .n { font-size: 13px; font-weight: 600; }
.cell .s { font-size: 10px; line-height: 1.2; color: var(--muted); }
.cell.lift { background: var(--lift); color: #0b2814; }
.cell.lift .s { color: #0b2814; }
.cell.cardio { background: var(--cardio); }
.cell.cardio .s { color: #b9d9c2; }
.cell.sun { background: var(--sun); }
.cell.empty { visibility: hidden; }
.cell.today { box-shadow: inset 0 0 0 2px var(--fg); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--raise); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 18px; font-weight: 600; }
.stat span { font-size: 12px; color: var(--muted); }
textarea { width: 100%; min-height: 70px; background: var(--raise); color: var(--fg); border: 0; border-radius: 10px; padding: 10px; font: inherit; font-size: 16px; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  display: flex; justify-content: center; gap: 10px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
.tabs button { flex: 1; max-width: 200px; border: 0; background: transparent; border-radius: 12px; padding: 10px; font-size: 14px; color: var(--muted); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .dots.shake { animation: none; } }
</style>
</head>

const TARGET = {kcal:3600, p:150, c:450, f:120};
const KEY = 'the-diet-app-v1';
const PIN = '1126';
const liftDays = [1,2,4,6]; // Mon Tue Thu Sat
const pad2 = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const dateOf = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());

let DB = load();
function load(){ try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && x.days) return x; } catch(e){} return {days:{}}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }
const peek = k => DB.days[k];
const day = k => DB.days[k] || (DB.days[k] = {sel:{}});

let cur = todayKey(), view = 'today';
let calMonth = new Date(); calMonth.setDate(1);
const open = {};

function isRest(k){
  const t = peek(k) && peek(k).type;
  if (t === 'lift') return false;
  if (t === 'cardio') return true;
  return !liftDays.includes(dateOf(k).getDay());
}

function sumMeal(sel){
  const t = {m:[0,0,0,0,0,0,0], v:{}, col:0};
  for (const id in (sel||{})) {
    const q = sel[id]; if (!q || !F[id]) continue; const f = F[id];
    f[2].forEach((x,i)=> t.m[i] += x*q);
    for (const k in f[3]) t.v[k] = (t.v[k]||0) + f[3][k]*q;
    if (COLLAGEN_PROTEIN[id]) t.col += COLLAGEN_PROTEIN[id]*q;
  }
  return t;
}
function addT(a,b){ b.m.forEach((x,i)=>a.m[i]+=x); for (const k in b.v) a.v[k]=(a.v[k]||0)+b.v[k]; a.col+=b.col; return a; }
function dayTotals(k){
  const d = peek(k); const t = {m:[0,0,0,0,0,0,0], v:{}, col:0};
  if (d) MEALS.forEach(m => addT(t, sumMeal(d.sel[m.id])));
  return t;
}
function commit(k){
  const d = day(k); const t = dayTotals(k);
  d.tot = {k:Math.round(t.m[0]), p:Math.round(t.m[1])};
  save(); render();
}
const r0 = x => Math.round(x).toLocaleString();
function fmt(x,unit){
  if (unit==='IU' || x>=100) return Math.round(x).toLocaleString();
  if (x>=10) return x.toFixed(0);
  return x.toFixed(1).replace(/\.0$/,'');
}

/* ---------- lock ---------- */
let entry = '';
const lockEl = document.getElementById('lock'), rootEl = document.getElementById('root');
const padEl = document.getElementById('pad'), dotsEl = document.getElementById('dots');
['1','2','3','4','5','6','7','8','9','','0','del'].forEach(k => {
  const b = document.createElement('button'); b.type = 'button';
  if (k === '') { b.className = 'blank'; b.tabIndex = -1; }
  else if (k === 'del') { b.className = 'del'; b.textContent = 'Delete'; b.onclick = () => { entry = entry.slice(0,-1); drawDots(); }; }
  else { b.textContent = k; b.onclick = () => press(k); }
  padEl.appendChild(b);
});
function drawDots(){ [...dotsEl.children].forEach((d,i)=> d.classList.toggle('f', i < entry.length)); }
function press(k){
  if (entry.length >= 4) return;
  entry += k; drawDots();
  if (entry.length === 4) setTimeout(() => {
    if (entry === PIN) { lockEl.hidden = true; rootEl.hidden = false; entry = ''; drawDots(); cur = todayKey(); render(); }
    else { dotsEl.classList.add('shake'); setTimeout(()=>{ dotsEl.classList.remove('shake'); entry=''; drawDots(); }, 360); }
  }, 120);
}
document.addEventListener('keydown', e => {
  if (lockEl.hidden) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  if (e.key === 'Backspace') { entry = entry.slice(0,-1); drawDots(); }
});
function lock(){ lockEl.hidden = false; rootEl.hidden = true; entry=''; drawDots(); }
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 5*60*1000) lock();
});

/* ---------- render ---------- */
const head = document.getElementById('head'), main = document.getElementById('main');
document.getElementById('tabToday').onclick = () => { view='today'; render(); window.scrollTo(0,0); };
document.getElementById('tabCal').onclick = () => { view='cal'; calMonth = dateOf(cur); calMonth.setDate(1); render(); window.scrollTo(0,0); };

function render(){
  document.getElementById('tabToday').setAttribute('aria-pressed', String(view==='today'));
  document.getElementById('tabCal').setAttribute('aria-pressed', String(view==='cal'));
  if (view === 'today') renderToday(); else renderCal();
}

function shiftDay(n){ const d = dateOf(cur); d.setDate(d.getDate()+n); cur = keyOf(d); render(); }

function lastWeightBefore(k){
  const keys = Object.keys(DB.days).filter(x => x < k && DB.days[x].w).sort();
  return keys.length ? DB.days[keys[keys.length-1]].w : null;
}

function renderToday(){
  const t = dayTotals(cur);
  const d = dateOf(cur); const isToday = cur === todayKey();
  head.innerHTML = `
    <div class="row">
      <div class="dnav">
        <button type="button" id="prev" aria-label="Previous day">‹</button>
        <div><div class="dtitle">${isToday ? 'Today' : d.toLocaleDateString(undefined,{weekday:'long'})}</div><div class="dsub">${d.toLocaleDateString(undefined,{weekday: isToday?'long':undefined, month:'short', day:'numeric'})}</div></div>
        <button type="button" id="next" aria-label="Next day">›</button>
      </div>
      <button class="lockbtn" type="button" id="lockb">Lock</button>
    </div>
    <div class="row">
      <div class="kcal num">${r0(t.m[0])} <small>/ 3,600 kcal</small></div>
      <div class="mini num"><b>${r0(t.m[1])}</b>P · <b>${r0(t.m[2])}</b>C · <b>${r0(t.m[3])}</b>F</div>
    </div>
    <div class="track"><i style="width:${Math.min(100, t.m[0]/TARGET.kcal*100)}%"></i></div>`;
  head.querySelector('#prev').onclick = () => shiftDay(-1);
  head.querySelector('#next').onclick = () => shiftDay(1);
  head.querySelector('#lockb').onclick = lock;

  main.innerHTML = '';
  const rest = isRest(cur);
  const dd = peek(cur) || {sel:{}};

  // check-in card
  const ci = document.createElement('section'); ci.className = 'card';
  const prevW = lastWeightBefore(cur);
  const delta = (dd.w && prevW) ? (dd.w - prevW) : null;
  ci.innerHTML = `
    <div class="check">
      <div class="wbox">
        <label for="wIn">Morning weigh-in</label>
        <div class="wline"><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="—" value="${dd.w ?? ''}" class="num"><span>lb</span></div>
        <div class="wdelta num">${delta === null ? (prevW ? 'Last: '+prevW+' lb' : 'Before eating') : (delta>=0?'+':'')+delta.toFixed(1)+' lb since last'}</div>
      </div>
      <div class="types">
        <div class="tlabel">Training</div>
        <div class="tgrid">
          <button type="button" class="tbtn lift" id="tLift" aria-pressed="${dd.type==='lift'}">Lifted</button>
          <button type="button" class="tbtn cardio" id="tCardio" aria-pressed="${dd.type==='cardio'}">Cardio</button>
        </div>
      </div>
    </div>`;
  ci.querySelector('#wIn').addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    if (isNaN(v) || v <= 0) delete day(cur).w; else day(cur).w = Math.round(v*10)/10;
    commit(cur);
  });
  const setType = ty => { const x = day(cur); x.type = x.type === ty ? undefined : ty; if (!x.type) delete x.type; commit(cur); };
  ci.querySelector('#tLift').onclick = () => setType('lift');
  ci.querySelector('#tCardio').onclick = () => setType('cardio');
  main.appendChild(ci);

  // meals
  MEALS.forEach(meal => {
    const sel = dd.sel[meal.id] || {};
    const mt = sumMeal(sel);
    const sec = document.createElement('section'); sec.className = 'card';
    const title = rest && meal.rest ? meal.rest : meal.title;
    const when = rest && meal.restWhen ? meal.restWhen : meal.when;
    const tip = rest && meal.restTip ? meal.restTip : meal.tip;
    sec.innerHTML = `<div class="mh"><h2>${title}</h2><span class="when">${when}</span></div><p class="tip">${tip}</p>`;
    (rest && meal.restGroups ? meal.restGroups : meal.groups).forEach(([label, ids]) => {
      const g = document.createElement('div'); g.className = 'group';
      g.innerHTML = `<div class="glabel">${label}</div>`;
      const chips = document.createElement('div'); chips.className = 'chips';
      ids.forEach(id => {
        const f = F[id]; const q = sel[id]||0; const isQ = label !== 'Supplements';
        const wrap = document.createElement('span'); wrap.className = 'qwrap';
        const b = document.createElement('button'); b.type='button';
        b.className = 'chip' + (q ? ' on' : ''); b.setAttribute('aria-pressed', String(!!q));
        b.innerHTML = `${f[0]}${f[1]?` <small>${f[1]}</small>`:''}${isQ && q ? ` <span class="qty">×${q}</span>`:''}`;
        b.onclick = () => { const x = day(cur); x.sel[meal.id] = x.sel[meal.id] || {}; const c = x.sel[meal.id][id]||0; x.sel[meal.id][id] = isQ ? c+1 : (c?0:1); commit(cur); };
        wrap.appendChild(b);
        if (isQ && q) {
          const m = document.createElement('button'); m.type='button'; m.className='minus'; m.textContent='−';
          m.setAttribute('aria-label','One less '+f[0]);
          m.onclick = () => { day(cur).sel[meal.id][id] = q-1; commit(cur); };
          wrap.appendChild(m);
        }
        chips.appendChild(wrap);
      });
      g.appendChild(chips); sec.appendChild(g);
    });
    const act = document.createElement('div'); act.className='actions';
    const usual = rest && meal.restUsual ? meal.restUsual : meal.usual;
    if (usual) {
      const u = document.createElement('button'); u.type='button'; u.className='btn primary'; u.textContent='Ate the usual';
      u.onclick = () => { const x = day(cur); x.sel[meal.id] = Object.assign({}, x.sel[meal.id]||{}, usual); commit(cur); };
      act.appendChild(u);
    }
    if (Object.values(sel).some(Boolean)) {
      const c = document.createElement('button'); c.type='button'; c.className='btn'; c.textContent='Clear';
      c.onclick = () => { day(cur).sel[meal.id] = {}; commit(cur); };
      act.appendChild(c);
    }
    if (act.children.length) sec.appendChild(act);
    const sub = document.createElement('div'); sub.className='sub';
    const isOpen = !!open[meal.id];
    sub.innerHTML = `<div class="row"><div class="sub-mac num"><b>${r0(mt.m[0])}</b> <span>kcal ·</span> <b>${r0(mt.m[1])}</b><span>P ·</span> <b>${r0(mt.m[2])}</b><span>C ·</span> <b>${r0(mt.m[3])}</b><span>F</span></div><button class="link" type="button">${isOpen?'Hide nutrients':'Nutrients'}</button></div>`;
    sub.querySelector('.link').onclick = () => { open[meal.id] = !isOpen; render(); };
    if (isOpen) {
      const grid = document.createElement('div'); grid.className='mgrid num';
      let html = [['Fiber',mt.m[4]],['Sugar',mt.m[5]],['Sat fat',mt.m[6]]].map(([n,x])=>`<div><span>${n}</span>${fmt(x)} g</div>`).join('');
      html += MIC.map(([k,n,u,dv]) => `<div><span>${n}</span>${Math.round((mt.v[k]||0)/dv*100)}%</div>`).join('');
      grid.innerHTML = html; sub.appendChild(grid);

    sec.appendChild(sub);
    main.appendChild(sec);
  });

  // day totals
  const tot = document.createElement('section'); tot.className = 'card';
  const row = (name, x, goal, unit, cls='') => {
    const pct = goal ? x/goal*100 : 0;
    return `<div class="r ${cls}"><span>${name}</span><span class="v num">${fmt(x,unit)} ${unit}${goal?` <span>/ ${fmt(goal,unit)} · ${Math.round(pct)}%</span>`:''}</span>${goal?`<div class="track"><i style="width:${Math.min(100,pct)}%"></i></div>`:''}</div>`;
  };
  let h = `<div><h3>Day totals</h3><div class="rows">`;
  h += row('Calories', t.m[0], TARGET.kcal, 'kcal') + row('Protein', t.m[1], TARGET.p, 'g');
  h += `<p class="note num">${r0(t.m[1]-t.col)} g complete protein, ${r0(t.col)} g collagen</p>`;
  h += row('Carbs', t.m[2], TARGET.c, 'g') + row('Fat', t.m[3], TARGET.f, 'g') + row('Fiber', t.m[4], 28, 'g');
  h += row('Sugar', t.m[5], 0, 'g') + row('Saturated fat', t.m[6], 0, 'g') + `</div></div>`;
  h += `<div><h3>Vitamins · % daily value</h3><div class="rows">` + MIC.slice(0,13).map(([k,n,u,dv])=>row(n, t.v[k]||0, dv, u)).join('') + `</div></div>`;
  h += `<div><h3>Minerals · % daily value</h3><div class="rows">` + MIC.slice(13).map(([k,n,u,dv])=>row(n, t.v[k]||0, dv, u, k==='Na' && (t.v.Na||0)>dv ? 'over':'')).join('') + `</div></div>`;
  h += `<p class="note">Estimates from standard USDA values. Collagen counts toward calories but isn't a complete protein.</p>`;
  h += `<div class="actions"><button class="btn" type="button" id="clr">Clear this day's food</button></div>`;
  tot.innerHTML = h;
  main.appendChild(tot);
  const cb = tot.querySelector('#clr');
  cb.onclick = () => {
    if (cb.dataset.arm) { day(cur).sel = {}; commit(cur); return; }
    cb.dataset.arm = '1'; cb.textContent = 'Tap again to clear';
    setTimeout(() => { if (cb.isConnected) { delete cb.dataset.arm; cb.textContent = "Clear this day's food"; } }, 3000);
  };
}

function avgWeight(endKey, n){
  const end = dateOf(endKey); const ws = [];
  for (let i=0; i<n; i++) { const d = new Date(end); d.setDate(d.getDate()-i); const x = peek(keyOf(d)); if (x && x.w) ws.push(x.w); }
  return ws.length ? ws.reduce((a,b)=>a+b,0)/ws.length : null;
}

function renderCal(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  head.innerHTML = `
    <div class="row">
      <div class="dnav">
        <button type="button" id="pm" aria-label="Previous month">‹</button>
        <div class="dtitle">${calMonth.toLocaleDateString(undefined,{month:'long', year:'numeric'})}</div>
        <button type="button" id="nm" aria-label="Next month">›</button>
      </div>
      <button class="lockbtn" type="button" id="lockb">Lock</button>
    </div>`;
  head.querySelector('#pm').onclick = () => { calMonth = new Date(y, m-1, 1); render(); };
  head.querySelector('#nm').onclick = () => { calMonth = new Date(y, m+1, 1); render(); };
  head.querySelector('#lockb').onclick = lock;

  main.innerHTML = '';
  const c = document.createElement('section'); c.className = 'card';
  let g = '<div class="cal">' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('');
  const first = new Date(y, m, 1); const lead = (first.getDay()+6)%7;
  const days = new Date(y, m+1, 0).getDate();
  for (let i=0; i<lead; i++) g += '<div class="cell empty"></div>';
  const tk = todayKey();
  for (let dn=1; dn<=days; dn++) {
    const dt = new Date(y, m, dn); const k = keyOf(dt); const x = peek(k) || {};
    let cls = 'cell';
    if (dt.getDay() === 0) cls += ' sun';
    else if (x.type === 'lift') cls += ' lift';
    else if (x.type === 'cardio') cls += ' cardio';
    if (k === tk) cls += ' today';
    const kc = x.tot && x.tot.k ? (x.tot.k/1000).toFixed(1)+'k' : '';
    g += `<button type="button" class="${cls}" data-k="${k}" aria-label="${dt.toDateString()}"><span class="n">${dn}</span><span class="s num">${kc}${kc&&x.w?'<br>':''}${x.w?x.w:''}</span></button>`;
  }
  g += '</div>';
  c.innerHTML = g + `<div class="legend"><span><i style="background:var(--lift)"></i>Lifted</span><span><i style="background:var(--cardio)"></i>Cardio</span><span><i style="background:var(--sun)"></i>Sunday</span><span>Numbers: calories, weight</span></div>`;
  c.querySelectorAll('.cell[data-k]').forEach(b => b.onclick = () => { cur = b.dataset.k; view = 'today'; render(); window.scrollTo(0,0); });
  main.appendChild(c);

  // this week + weight trend
  const now = new Date(); const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7));
  let kcals = [], lifts = 0, cardio = 0;
  for (let i=0; i<7; i++) { const d = new Date(mon); d.setDate(mon.getDate()+i); const x = peek(keyOf(d)); if (!x) continue; if (x.tot && x.tot.k) kcals.push(x.tot.k); if (x.type==='lift') lifts++; if (x.type==='cardio') cardio++; }
  const a7 = avgWeight(tk, 7); const prevEnd = new Date(); prevEnd.setDate(prevEnd.getDate()-7); const p7 = avgWeight(keyOf(prevEnd), 7);
  const s = document.createElement('section'); s.className = 'card';
  s.innerHTML = `<h3 style="margin:0">This week</h3>
    <div class="stats num">
      <div class="stat"><b>${kcals.length ? r0(kcals.reduce((a,b)=>a+b,0)/kcals.length) : '—'}</b><span>avg kcal / day</span></div>
      <div class="stat"><b>${lifts} · ${cardio}</b><span>lifts · cardio days</span></div>
      <div class="stat"><b>${a7 ? a7.toFixed(1)+' lb' : '—'}</b><span>7-day avg weight</span></div>
      <div class="stat"><b>${a7 && p7 ? ((a7-p7)>=0?'+':'')+(a7-p7).toFixed(1)+' lb' : '—'}</b><span>vs last week · aim +0.5 to 1</span></div>
    </div>`;
  main.appendChild(s);

  // backup
  const bk = document.createElement('section'); bk.className = 'card';
  bk.innerHTML = `<h3 style="margin:0">Backup</h3>
    <p class="note">Everything is saved only on this phone. Copy a backup now and then and paste it in Notes.</p>
    <div class="actions"><button class="btn" type="button" id="copyB">Copy backup</button></div>
    <textarea id="restoreT" placeholder="Paste a backup here to restore it"></textarea>
    <div class="actions"><button class="btn" type="button" id="restoreB">Restore</button><span class="note" id="bmsg"></span></div>`;
  main.appendChild(bk);
  const msg = bk.querySelector('#bmsg');
  bk.querySelector('#copyB').onclick = () => {
    const txt = JSON.stringify(DB);
    const ta = bk.querySelector('#restoreT');
    const fallback = () => { ta.value = txt; ta.select(); msg.textContent = 'Copy the selected text.'; };
    try { navigator.clipboard.writeText(txt).then(()=>{ msg.textContent = 'Copied.'; }, fallback); } catch(e) { fallback(); }
  };
  const rb = bk.querySelector('#restoreB');
  rb.onclick = () => {
    let x; try { x = JSON.parse(bk.querySelector('#restoreT').value); } catch(e) {}
    if (!x || !x.days) { msg.textContent = 'That text is not a backup from this app.'; return; }
    if (!rb.dataset.arm) { rb.dataset.arm = '1'; rb.textContent = 'Tap again to replace all data'; return; }
    DB = x; save(); msg.textContent = 'Restored.'; render();
  };
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
